                      <div className="text-[14.5px] leading-relaxed text-kn-grayDark whitespace-pre-line font-normal break-keep">
                        {activeReport.content}
                      </div>

                      {/* Post Attached Photos */}
                      {activeReport.imageUrls && activeReport.imageUrls.length > 0 && (
                        <div className="pt-2">
                          <div className="text-xs font-bold text-kn-graySub mb-2 flex items-center gap-1">
                            <span>📷 알림장 첨부 사진</span>
                            <span className="text-kn-yellowDark font-extrabold">({activeReport.imageUrls.length})</span>
                          </div>
                          <div className={`grid gap-2 ${activeReport.imageUrls.length === 1 ? 'grid-cols-1' : 'grid-cols-2'}`}>
                            {activeReport.imageUrls.map((img, i) => (
                              <div
                                key={i}
                                onClick={() => setModalImage(img)}
                                className="rounded-xl overflow-hidden aspect-video bg-gray-100 border border-gray-200 cursor-pointer relative group"
                              >
                                <img src={img} alt="알림장 사진" className="w-full h-full object-cover group-hover:scale-105 transition-transform" />
                                <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                  <span className="bg-black/70 text-white text-xs px-2.5 py-1 rounded-full">확대 🔍</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Kidsnote Authentic Empathy Action Bar */}
                      <div className="pt-3 border-t border-kn-borderLight flex items-center justify-between">
                        <button
                          onClick={() => toggleLike(activeReport.id || selectedDateIdx)}
                          className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all ${
                            likedPosts[activeReport.id || selectedDateIdx]
                              ? 'bg-rose-50 text-rose-600 border border-rose-200'
                              : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                          }`}
                        >
                          <span>{likedPosts[activeReport.id || selectedDateIdx] ? '❤️' : '🤍'}</span>
                          <span>공감해요 {likedPosts[activeReport.id || selectedDateIdx] ? '1' : '0'}</span>
                        </button>

                        <span className="text-xs font-semibold text-kn-graySub">
                          💬 댓글 {activeReport.comments?.length || 0}개
                        </span>
                      </div>

                      {/* Comments Thread (Genuine Kidsnote Bubble Style) */}
                      {activeReport.comments && activeReport.comments.length > 0 && (
                        <div className="mt-4 pt-3 border-t border-dashed border-gray-200 space-y-2.5">
                          <div className="text-xs font-extrabold text-kn-dark flex items-center justify-between">
                            <span className="flex items-center gap-1.5">
                              <span>💬 선생님·학부모 댓글 소통</span>
                              <span className="text-kn-yellowDark font-black">({activeReport.comments.length})</span>
                            </span>
                            <span className="text-[10px] text-gray-400 font-normal">시간순 전수 노출</span>
                          </div>

                          <div className="space-y-2.5">
                            {activeReport.comments.map((comment, cIdx) => {
                              const isTeacher = comment.author.includes('교사');
                              return (
                                <div
                                  key={cIdx}
                                  className={`rounded-xl p-3 text-xs space-y-1.5 border transition-all ${
                                    isTeacher
                                      ? 'bg-kn-yellowWarm border-amber-200/90 shadow-sm'
                                      : 'bg-white border-gray-200/90 shadow-subtle'
                                  }`}
                                >
                                  {/* Comment Header */}
                                  <div className="flex items-center justify-between text-[11px]">
                                    <div className="flex items-center gap-1.5">
                                      <span className="text-sm">{isTeacher ? '👩‍🏫' : '🙋‍♀️'}</span>
                                      <span className={`font-bold ${isTeacher ? 'text-amber-900' : 'text-gray-900'}`}>
                                        {comment.author}
                                      </span>
                                      <span className={`text-[9px] px-1 py-0.2 rounded font-bold ${
                                        isTeacher ? 'bg-amber-100 text-amber-800' : 'bg-blue-50 text-blue-700'
                                      }`}>
                                        {isTeacher ? '담임교사' : '학부모'}
                                      </span>
                                    </div>
                                    <span className="text-[10px] text-gray-400">{comment.date}</span>
                                  </div>

                                  {/* Comment Body */}
                                  <p className="text-kn-grayDark leading-relaxed whitespace-pre-line text-[12.5px] font-normal break-keep">
                                    {comment.content}
                                  </p>

                                  {/* Comment Attached Photos (e.g. Ishigaki Photos) */}
                                  {comment.imageUrls && comment.imageUrls.length > 0 && (
                                    <div className="mt-2 pt-2 border-t border-amber-100">
                                      <div className="text-[10px] font-bold text-amber-800 mb-1 flex items-center gap-1">
                                        <span>📸 댓글 첨부 사진</span>
                                        <span className="font-extrabold text-kn-yellowDark">({comment.imageUrls.length}장)</span>
                                      </div>
                                      <div className="grid grid-cols-3 gap-1.5">
                                        {comment.imageUrls.map((imgUrl, imgIdx) => (
                                          <div
                                            key={imgIdx}
                                            onClick={() => setModalImage(imgUrl)}
                                            className="rounded-lg overflow-hidden aspect-square border border-amber-200 bg-white cursor-pointer relative group shadow-sm"
                                          >
                                            <img
                                              src={imgUrl}
                                              alt="댓글 사진"
                                              className="w-full h-full object-cover group-hover:scale-105 transition-transform"
                                              loading="lazy"
                                            />
                                            <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                              <span className="text-white text-[10px]">🔍</span>
                                            </div>
                                          </div>
                                        ))}
                                      </div>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>
                  </article>
                )}
              </div>
            )}

            {/* TAB: NOTICE (공지사항 / 가정통신문) */}
            {currentTab === 'notice' && (
              <div className="space-y-3">
                <div className="text-xs font-bold text-kn-graySub px-1 flex items-center justify-between">
                  <span>📢 {activeChildData?.schoolName} 공식 공지사항</span>
                  <span className="text-kn-yellowDark font-extrabold">{notices.length}건</span>
                </div>

                {notices.map((notice) => (
                  <article key={notice.id} className="bg-white rounded-2xl border border-kn-border p-4 shadow-appCard space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">
                        원 공지
                      </span>
                      <h3 className="font-bold text-sm text-kn-dark truncate flex-1">
                        {notice.title}
                      </h3>
                    </div>

                    <div className="text-xs text-gray-400">
                      작성: {notice.author} · {notice.date}
                    </div>

                    <div className="text-[13px] leading-relaxed text-kn-grayDark whitespace-pre-line break-keep">
                      {notice.content}
                    </div>

                    {/* Notice Attachment & OCR Summary */}
                    {notice.imageUrls && notice.imageUrls.length > 0 && (
                      <div className="pt-2">
                        <div className="text-xs font-bold text-blue-800 mb-1.5 flex items-center gap-1">
                          <span>📎 가정통신문 첨부문서</span>
                          <span className="text-blue-600">({notice.imageUrls.length})</span>
                        </div>
                        {notice.imageUrls.map((img, i) => (
                          <div
                            key={i}
                            onClick={() => setModalImage(img)}
                            className="rounded-xl overflow-hidden aspect-video border border-blue-200 cursor-pointer relative group"
                          >
                            <img src={img} alt="가정통신문 원본" className="w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                              <span className="bg-black/70 text-white text-xs px-2.5 py-1 rounded-full">문서 원본 크게보기 🔍</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {notice.ocrSummary && (
                      <div className="p-3 bg-blue-50/80 rounded-xl border border-blue-200 space-y-1">
                        <div className="text-xs font-bold text-blue-900 flex items-center gap-1">
                          <span>📋</span>
                          <span>가정통신문 핵심 요약 (AI 판독)</span>
                        </div>
                        <div className="text-xs text-blue-800 leading-relaxed whitespace-pre-line">
                          {notice.ocrSummary}
                        </div>
                      </div>
                    )}
                  </article>
                ))}
              </div>
            )}

            {/* TAB: ALBUM (사진첩) */}
            {currentTab === 'album' && (
              <div className="bg-white rounded-2xl border border-kn-border p-4 shadow-appCard space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-sm text-kn-dark">📸 아이 활동 사진 모아보기</h3>
                  <span className="text-xs text-kn-yellowDark font-bold">전체 사진</span>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {/* Gather all photos from reports and notices */}
                  {reports.flatMap(r => r.imageUrls || []).concat(
                    reports.flatMap(r => (r.comments || []).flatMap(c => c.imageUrls || []))
                  ).map((imgUrl, idx) => (
                    <div
                      key={idx}
                      onClick={() => setModalImage(imgUrl)}
                      className="rounded-lg overflow-hidden aspect-square border border-gray-200 bg-gray-100 cursor-pointer group"
                    >
                      <img src={imgUrl} alt="활동 사진" className="w-full h-full object-cover group-hover:scale-105 transition-transform" />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: MEAL (식단표) */}
            {currentTab === 'meal' && (
              <div className="bg-white rounded-2xl border border-kn-border p-5 text-center shadow-appCard space-y-3">
                <div className="text-4xl">🍱</div>
                <h3 className="font-bold text-base text-kn-dark">오늘의 영양 식단표</h3>
                <div className="p-4 bg-amber-50/60 rounded-xl border border-amber-200/70 text-left text-xs space-y-2">
                  <div className="font-bold text-amber-900">점심 식단:</div>
                  <p className="text-gray-700">차조밥, 쇠고기미역국, 돈육메추리알장조림, 애호박새송이볶음, 깍두기</p>
                  <div className="font-bold text-amber-900 pt-1">오후 간식:</div>
                  <p className="text-gray-700">낙엽스낵 (고구마스틱), 제철 귤, 유기농 멸균우유</p>
                </div>
                <p className="text-[11px] text-gray-400">원흥유치원 / 푸른솔어린이집 급식실 제공</p>
              </div>
            )}

          </main>

          {/* 4. Authentic Kidsnote Bottom Navigation Bar */}
          <nav className="fixed bottom-0 max-w-[430px] w-full bg-white border-t border-kn-border flex items-center justify-around py-2 z-40 shadow-bottomNav">
            {[
              { id: 'report', label: '알림장', icon: '📝', badge: reports.length },
              { id: 'notice', label: '공지사항', icon: '📢', badge: notices.length },
              { id: 'album', label: '사진첩', icon: '📸' },
              { id: 'meal', label: '식단표', icon: '🍱' },
            ].map(tab => {
              const isActive = currentTab === tab.id;
              return (
                <button
                  key={tab.id}
                  onClick={() => setCurrentTab(tab.id)}
                  className={`flex flex-col items-center justify-center flex-1 py-1 transition-colors relative ${
                    isActive ? 'text-kn-yellowDark font-extrabold' : 'text-gray-400 hover:text-gray-600'
                  }`}
                >
                  <span className="text-xl leading-none mb-1">{tab.icon}</span>
                  <span className="text-[11px]">{tab.label}</span>
                  {tab.badge !== undefined && (
                    <span className={`absolute top-0 right-5 text-[9px] px-1.5 py-0.2 rounded-full font-bold ${
                      isActive ? 'bg-kn-yellow text-white' : 'bg-gray-200 text-gray-600'
                    }`}>
                      {tab.badge}
                    </span>
                  )}
                  {isActive && (
                    <span className="w-5 h-0.5 bg-kn-yellow rounded-full mt-0.5"></span>
                  )}
                </button>
              );
            })}
          </nav>

          {/* 5. Fullscreen Lightbox Modal */}
          {modalImage && (
            <div
              onClick={() => setModalImage(null)}
              className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-2 backdrop-blur-md cursor-zoom-out"
            >
              <div className="relative max-w-full max-h-full">
                <img
                  src={modalImage}
                  alt="사진 확대보기"
                  className="max-h-[90vh] max-w-[95vw] object-contain rounded-xl shadow-2xl"
                />
                <button
                  onClick={() => setModalImage(null)}
                  className="absolute top-4 right-4 bg-white/30 text-white font-bold px-3.5 py-1.5 rounded-full hover:bg-white/50 transition-colors text-sm"
                >
                  닫기 ✕
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
