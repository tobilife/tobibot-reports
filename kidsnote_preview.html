          {/* 6. FULLSCREEN HD LIGHTBOX MODAL                                */}
          {/* ============================================================== */}
          {modalImage && (
            <div
              onClick={() => setModalImage(null)}
              className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-3 backdrop-blur-md cursor-zoom-out animate-fade-in"
            >
              <div className="relative max-w-full max-h-full">
                <img
                  src={modalImage}
                  alt="사진 확대보기"
                  className="max-h-[90vh] max-w-[95vw] object-contain rounded-2xl shadow-2xl"
                />
                <button
                  onClick={() => setModalImage(null)}
                  className="absolute top-4 right-4 bg-white/25 hover:bg-white/40 text-white font-bold px-4 py-1.5 rounded-full backdrop-blur-md transition-colors text-xs"
                >
                  닫기 ✕
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
