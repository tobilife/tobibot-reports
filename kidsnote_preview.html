                    <div className="flex items-center gap-2.5">
                      <div className="w-9 h-9 rounded-full bg-amber-500/10 text-amber-600 flex items-center justify-center font-bold text-sm">
                        {record.category === 'notice' ? '📢' : '✏️'}
                      </div>
                      <div>
                        <div className="flex items-center gap-1.5">
                          <span className={`text-[11px] font-bold px-2 py-0.5 rounded-md ${
                            record.category === 'notice'
                              ? 'bg-blue-50 text-blue-600'
                              : 'bg-amber-50 text-amber-700'
                          }`}>
                            {record.category === 'notice' ? '공지사항' : '알림장'}
                          </span>
                          <span className="text-xs font-bold text-kn-dark truncate max-w-[170px]">
                            {record.author || (currentChild === 'ayoon' ? '원흥유치원 교사' : '푸른솔어린이집 교사')}
                          </span>
                        </div>
                        <div className="text-[11px] text-kn-muted mt-0.5">
                          {record.date}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Card Title & Body */}
                  <div className="p-4 pt-3.5 space-y-3">
                    {record.title && (
                      <h3 className="font-bold text-[15px] leading-snug text-kn-dark tracking-tight">
                        {record.title}
                      </h3>
                    )}

                    <div className="text-[13.5px] leading-relaxed text-[#2C333E] whitespace-pre-line font-normal break-keep">
                      {record.content}
                    </div>

                    {/* Attached Photo Gallery */}
                    {record.imageUrls && record.imageUrls.length > 0 && (
                      <div className="pt-2">
                        <div className="text-[11px] font-bold text-kn-muted mb-2 flex items-center gap-1">
                          <span>📸 첨부 사진</span>
                          <span className="text-amber-600 font-extrabold">({record.imageUrls.length})</span>
                        </div>
                        <div className={`grid gap-2 ${
                          record.imageUrls.length === 1 ? 'grid-cols-1' : 'grid-cols-2'
                        }`}>
                          {record.imageUrls.map((imgUrl, idx) => (
                            <div
                              key={idx}
                              onClick={() => setModalImage(imgUrl)}
                              className="relative rounded-xl overflow-hidden bg-gray-100 aspect-video cursor-pointer border border-gray-200 group"
                            >
                              <img
                                src={imgUrl}
                                alt="첨부 사진"
                                className="w-full h-full object-cover transition-transform duration-200 group-hover:scale-105"
                                loading="lazy"
                              />
                              <div className="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors flex items-center justify-center">
                                <span className="opacity-0 group-hover:opacity-100 bg-black/60 text-white text-[11px] font-medium px-2 py-1 rounded-full backdrop-blur-sm transition-opacity">
                                  크게보기 🔍
                                </span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* OCR Summary Box if notice flyer */}
                    {record.ocrSummary && (
                      <div className="mt-3 p-3.5 bg-blue-50/70 border border-blue-200/80 rounded-xl space-y-1.5">
                        <div className="flex items-center gap-1.5 text-xs font-bold text-blue-700">
                          <span>📋</span>
                          <span>가정통신문 핵심 요약 (AI 판독)</span>
                        </div>
                        <div className="text-xs text-blue-900 leading-relaxed whitespace-pre-line">
                          {record.ocrSummary}
                        </div>
                      </div>
                    )}

                    {/* Teacher / Reply Comments Section */}
                    {record.comments && record.comments.length > 0 && (
                      <div className="mt-4 pt-3.5 border-t border-dashed border-gray-200 space-y-2">
                        <div className="flex items-center gap-1.5 text-xs font-bold text-amber-800">
                          <span>💬</span>
                          <span>선생님 답글 및 소통 댓글 ({record.comments.length})</span>
                        </div>
                        <div className="space-y-2">
                          {record.comments.map((comment, cIdx) => (
                            <div
                              key={cIdx}
                              className="bg-amber-50/60 border-l-[3px] border-amber-500 rounded-r-xl p-3 text-xs space-y-1"
                            >
                              <div className="flex items-center justify-between text-[11px] font-bold text-amber-900/80">
                                <span className="flex items-center gap-1">
                                  <span>👩‍🏫</span>
                                  <span>{comment.author}</span>
                                </span>
                                <span className="text-kn-muted font-normal">{comment.date}</span>
                              </div>
                              <p className="text-kn-dark leading-relaxed whitespace-pre-line font-medium">
                                {comment.content}
                              </p>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Card Footer Action Bar */}
                  <div className="px-4 py-2.5 bg-gray-50/80 border-t border-gray-100 flex items-center justify-between text-xs text-kn-muted">
                    <div className="flex items-center gap-3">
                      <span className="flex items-center gap-1 hover:text-red-500 cursor-pointer transition-colors">
                        <span>❤️</span>
                        <span className="font-semibold text-kn-dark">공감</span>
                      </span>
                      {record.comments && record.comments.length > 0 && (
                        <span className="flex items-center gap-1">
                          <span>💬</span>
                          <span>댓글 {record.comments.length}</span>
                        </span>
                      )}
                    </div>
                    <span className="text-[11px] text-gray-400">키즈노트 인증글</span>
                  </div>
                </article>
              ))
            )}
          </main>

          {/* Photo Modal Lightbox */}
          {modalImage && (
            <div
              onClick={() => setModalImage(null)}
              className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm cursor-zoom-out animate-fadeIn"
            >
              <div className="relative max-w-full max-h-full">
                <img
                  src={modalImage}
                  alt="사진 확대"
                  className="max-h-[85vh] max-w-[95vw] object-contain rounded-lg shadow-2xl"
                />
                <button
                  onClick={() => setModalImage(null)}
                  className="absolute -top-10 right-0 text-white text-sm font-bold bg-white/20 hover:bg-white/40 px-3 py-1 rounded-full transition-colors"
                >
                  닫기 ✕
                </button>
              </div>
            </div>
          )}

          {/* Footer Note */}
          <footer className="text-center py-6 text-[11px] text-kn-muted space-y-1">
            <div className="flex items-center justify-center gap-1.5 font-bold text-gray-500">
              <span>💛</span>
              <span>토비 키즈노트 모바일 전용 뷰어</span>
            </div>
            <p>상기형님 가족 전용 키즈노트 브리핑 시스템</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
