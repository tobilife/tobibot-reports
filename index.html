<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토비 리포트 & 대시보드</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #1e293b; border-radius: 16px; padding: 32px; max-width: 560px; text-align: center; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { margin: 0 0 12px 0; font-size: 24px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 토비 봇 리포트 아카이브</h1>
    <p>카카오톡 및 메신저 봇 토비가 생성한 웹 리포트 및 대시보드가 실시간으로 발행되는 공간입니다.</p>
  </div>
</body>
</html>
