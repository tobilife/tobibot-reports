                  ))}
                </div>
              </div>
            )}

            {/* ------------------------------------------------------------ */}
            {/* VIEW 4: MEAL (식단표)                                        */}
            {/* ------------------------------------------------------------ */}
            {currentTab === 'meal' && (
              <div className="glass-panel rounded-3xl p-6 text-center shadow-glassCard space-y-4">
                <div className="w-16 h-16 rounded-3xl bg-gradient-to-tr from-emerald-300 to-teal-100 mx-auto flex items-center justify-center text-3xl shadow-sm border border-emerald-300/60">
                  🍱
                </div>
                <div>
                  <h3 className="font-black text-base text-kn-dark">오늘의 영양 식단표</h3>
                  <p className="text-xs text-gray-500 mt-0.5">유치원 및 어린이집 전문 영양사 식단</p>
                </div>
                <div className="p-4 bg-emerald-100/40 backdrop-blur-md rounded-2xl border border-emerald-300/60 text-left text-xs space-y-3">
                  <div>
                    <span className="font-bold text-emerald-900 bg-emerald-200/70 px-2 py-0.5 rounded text-[11px]">점심 식단</span>
                    <p className="text-gray-800 font-medium mt-1 leading-relaxed">차조밥, 쇠고기미역국, 돈육메추리알장조림, 애호박새송이볶음, 깍두기</p>
                  </div>
                  <div>
                    <span className="font-bold text-emerald-900 bg-emerald-200/70 px-2 py-0.5 rounded text-[11px]">오후 간식</span>
                    <p className="text-gray-800 font-medium mt-1 leading-relaxed">낙엽스낵 (고구마스틱), 제철 귤, 유기농 멸균우유</p>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* ============================================================== */}
          {/* 4. FLOATING FROSTED GLASS DOCK (Dribbble Signature Pill Nav)   */}
          {/* ============================================================== */}
          <nav className="fixed bottom-4 left-0 right-0 max-w-[430px] mx-auto px-4 z-40 pointer-events-none">
            <div className="glass-panel rounded-full p-2 flex items-center justify-around shadow-glassDock pointer-events-auto border border-white/80">
              {[
                { id: 'report', label: '알림장', Icon: Icons.Report, badge: reports.length },
                { id: 'notice', label: '공지사항', Icon: Icons.Notice, badge: notices.length },
                { id: 'album', label: '사진첩', Icon: Icons.Album },
                { id: 'meal', label: '식단표', Icon: Icons.Meal },
              ].map(tab => {
                const isActive = currentTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setCurrentTab(tab.id)}
                    className={`flex items-center gap-1.5 px-3.5 py-2 rounded-full transition-all duration-200 cursor-pointer active:scale-95 ${
                      isActive
                        ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-glowOrange font-black scale-105'
                        : 'text-kn-sub hover:text-kn-dark'
                    }`}
                  >
                    <tab.Icon />
                    <span className={`text-xs tracking-tight ${isActive ? 'block' : 'hidden sm:block'}`}>
                      {tab.label}
                    </span>
                    {tab.badge !== undefined && !isActive && (
                      <span className="text-[9px] bg-amber-100 text-amber-800 font-bold px-1.5 py-0.2 rounded-full">
                        {tab.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          </nav>

          {/* ============================================================== */}
          {/* 5. FULLSCREEN HD LIGHTBOX MODAL                                */}
          {/* ============================================================== */}
          {modalImage && (
            <div
              onClick={() => setModalImage(null)}
              className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-3 backdrop-blur-xl cursor-zoom-out animate-fade-in"
            >
              <div className="relative max-w-full max-h-full">
                <img
                  src={modalImage}
                  alt="사진 확대보기"
                  className="max-h-[90vh] max-w-[95vw] object-contain rounded-3xl shadow-2xl border border-white/20"
                />
                <button
                  onClick={() => setModalImage(null)}
                  className="absolute top-4 right-4 glass-panel text-white font-bold px-4 py-1.5 rounded-full backdrop-blur-md hover:bg-white/30 transition-colors text-xs"
                >
                  닫기 ✕
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
