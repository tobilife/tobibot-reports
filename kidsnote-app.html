  <style>
    * {

    /* 1. Main Fluffy 3D White Clay Card */
    .clay-card {
      background: #FFFFFF;

      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.95),
        inset -2px -2px 6px rgba(0, 0, 0, 0.05),

      border: 1.5px solid rgba(255, 255, 255, 0.9);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);

    .clay-btn:active {

      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-btn-orange:active {
      transform: scale(0.93) translateY(2px);
      box-shadow:

        inset -2px -2px 4px rgba(255, 255, 255, 0.3),
        0 3px 8px rgba(255, 138, 0, 0.25);

    /* 4. Pastel 3D Clay Category Tiles */
    .clay-tile-peach {
      background: linear-gradient(145deg, #FFF9F2 0%, #FFEEDD 100%);
      border-radius: 26px;
      box-shadow: 
        inset 3px 3px 5px rgba(255, 255, 255, 0.95),
        inset -3px -3px 6px rgba(255, 138, 0, 0.14),
        0 10px 20px -4px rgba(255, 138, 0, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.9);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .clay-tile-blue {
      background: linear-gradient(145deg, #F4F9FF 0%, #E3EFFF 100%);
      border-radius: 26px;
      box-shadow: 
        inset 3px 3px 5px rgba(255, 255, 255, 0.95),
        inset -3px -3px 6px rgba(9, 132, 227, 0.14),
        0 10px 20px -4px rgba(9, 132, 227, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.9);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);

    .clay-tile-blue:active { transform: scale(0.95); }

    .clay-tile-purple {
      background: linear-gradient(145deg, #FAF6FF 0%, #EFE5FF 100%);
      border-radius: 26px;
      box-shadow: 
        inset 3px 3px 5px rgba(255, 255, 255, 0.95),

      border: 2px solid rgba(255, 255, 255, 0.9);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);

    .clay-tile-mint {
      background: linear-gradient(145deg, #F2FCF7 0%, #DEFAF0 100%);
      border-radius: 26px;
      box-shadow: 
        inset 3px 3px 5px rgba(255, 255, 255, 0.95),
        inset -3px -3px 6px rgba(0, 184, 148, 0.14),

      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);

    /* 5. 3D Puffy Floating Bottom Navigation Dock */

      box-shadow:

      border-radius: 24px;
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.95),
        inset -2px -2px 6px rgba(255, 170, 0, 0.12),

                  <h3 className="font-black text-sm text-clay-dark">📸 아이 활동 사진 모아보기</h3>
                  <span className="text-xs text-clay-orange font-black">갤러리</span>
                </div>
                <div className="grid grid-cols-3 gap-2.5">
                  {reports.flatMap(r => r.imageUrls || []).concat(
                    reports.flatMap(r => (r.comments || []).flatMap(c => c.imageUrls || []))
                  ).map((imgUrl, idx) => (
                    <div
                      key={idx}
                      onClick={() => setModalImage(imgUrl)}
                      className="rounded-3xl overflow-hidden aspect-square border-2 border-white shadow-[0_4px_10px_rgba(0,0,0,0.06)] bg-white cursor-pointer active:scale-95 transition-transform"
                    >
                      <img src={imgUrl} alt="활동 사진" className="w-full h-full object-cover" />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: MEAL (식단표) */}
            {currentTab === 'meal' && (
              <div className="clay-card p-6 text-center space-y-4">
                <div className="w-16 h-16 rounded-3xl bg-emerald-100 mx-auto flex items-center justify-center text-3xl shadow-[inset_1px_1px_3px_rgba(255,255,255,0.8),_0_6px_14px_rgba(0,184,148,0.2)]">
                  🍱
                </div>
                <div>
                  <h3 className="font-black text-base text-clay-dark">오늘의 영양 식단표</h3>
                  <p className="text-xs text-clay-muted mt-0.5 font-bold">유치원 및 어린이집 전문 영양사 식단</p>
                </div>
                <div className="clay-tile-mint p-4 text-left text-xs space-y-3">
                  <div>
                    <span className="font-black text-emerald-900 bg-emerald-200 px-2 py-0.5 rounded-full text-[11px]">점심 식단</span>
                    <p className="text-gray-800 font-bold mt-1 leading-relaxed">차조밥, 쇠고기미역국, 돈육메추리알장조림, 애호박새송이볶음, 깍두기</p>
                  </div>
                  <div>
                    <span className="font-black text-emerald-900 bg-emerald-200 px-2 py-0.5 rounded-full text-[11px]">오후 간식</span>
                    <p className="text-gray-800 font-bold mt-1 leading-relaxed">낙엽스낵 (고구마스틱), 제철 귤, 유기농 멸균우유</p>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* ============================================================== */}
          {/* 4. 3D CLAY FLOATING BOTTOM DOCK                                */}
          {/* ============================================================== */}
          <nav className="fixed bottom-4 left-0 right-0 max-w-[430px] mx-auto px-4 z-40 pointer-events-none">
            <div className="clay-dock p-2 flex items-center justify-around pointer-events-auto">
              {[
                { id: 'report', label: '알림장', Icon: Icons.Report, badge: reports.length },
                { id: 'notice', label: '공지사항', Icon: Icons.Notice, badge: notices.length },
                { id: 'album', label: '사진첩', Icon: Icons.Album },
                { id: 'meal', label: '식단표', Icon: Icons.Meal },
              ].map(tab => {
                const isActive = currentTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setCurrentTab(tab.id)}
                    className={`flex items-center gap-1.5 px-4 py-2.5 rounded-full transition-all duration-200 cursor-pointer ${
                      isActive
                        ? 'clay-btn-orange scale-105'
                        : 'text-clay-gray hover:text-clay-dark active:scale-95'
                    }`}
                  >
                    <tab.Icon />
                    <span className={`text-xs font-black tracking-tight ${isActive ? 'block' : 'hidden sm:block'}`}>
                      {tab.label}
                    </span>
                    {tab.badge !== undefined && !isActive && (
                      <span className="text-[9px] bg-amber-100 text-amber-900 font-black px-1.5 py-0.2 rounded-full shadow-inner">
                        {tab.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          </nav>

          {/* ============================================================== */}
          {/* 5. FULLSCREEN HD LIGHTBOX                                      */}
          {/* ============================================================== */}
          {modalImage && (
            <div
              onClick={() => setModalImage(null)}
              className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-3 backdrop-blur-md cursor-zoom-out"
            >
              <div className="relative max-w-full max-h-full">
                <img
                  src={modalImage}
                  alt="사진 확대보기"
                  className="max-h-[90vh] max-w-[95vw] object-contain rounded-3xl shadow-2xl border-2 border-white/30"
                />
                <button
                  onClick={() => setModalImage(null)}
                  className="absolute top-4 right-4 bg-white/30 hover:bg-white/50 text-white font-black px-4 py-1.5 rounded-full backdrop-blur-md transition-colors text-xs shadow-lg"
                >
                  닫기 ✕
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
