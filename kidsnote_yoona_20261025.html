<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>키즈노트 모바일 리포트 - 토비</title>
  <style>
    :root {
      --primary: #FF9500;
      --primary-hover: #E08500;
      --primary-light: #FFF8EE;
      --primary-badge: #FFEFD6;
      --bg: #F5F6F8;
      --surface: #FFFFFF;
      --text-main: #191F28;
      --text-sub: #4E5968;
      --text-muted: #8B95A1;
      --border: #E5E8EB;
      --divider: #F2F4F6;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      letter-spacing: -0.3px;
      padding-bottom: 40px;
    }

    /* Mobile Container App Shell */
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--surface);
      min-height: 100vh;
      box-shadow: 0 0 24px rgba(0,0,0,0.05);
      position: relative;
    }

    /* Sticky Top Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    .brand-title span.logo-icon {
      font-size: 20px;
    }

    .timestamp {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Child Selector Tabs */
    .child-tabs {
      display: flex;
      padding: 12px 16px;
      background: var(--primary-light);
      border-bottom: 1px solid var(--primary-badge);
      gap: 10px;
    }

    .child-tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1.5px solid transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .child-tab-btn.active {
      border-color: var(--primary);
      background: #FFFFFF;
      box-shadow: var(--shadow-sm);
    }

    .child-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary-badge);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .child-tab-btn.active .child-avatar {
      background: var(--primary);
      color: #fff;
    }

    .child-info-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .child-info-school {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    /* Category Filter Pills */
    .category-bar {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--divider);
    }
    .category-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .cat-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    /* Record List Feed */
    .record-feed {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Card Item */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: var(--primary-badge);
      color: var(--primary-hover);
    }

    .card-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .card-author {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .card-body {
      font-size: 14px;
      color: var(--text-main);
      line-height: 1.6;
      word-break: keep-all;
      white-space: pre-line;
      background: #FAFAFA;
      padding: 14px;
      border-radius: var(--radius-sm);
    }

    /* Comments Section */
    .comments-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    .comments-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-hover);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .comment-item {
      background: #FFFDF9;
      border-left: 3px solid var(--primary);
      padding: 10px 12px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .comment-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .comment-text {
      color: var(--text-main);
      line-height: 1.5;
    }

    /* OCR Analysis Box */
    .ocr-box {
      margin-top: 14px;
      background: #F0F7FF;
      border: 1px solid #D0E4FF;
      border-radius: var(--radius-sm);
      padding: 14px;
    }

    .ocr-header {
      font-size: 13px;
      font-weight: 700;
      color: #0051C6;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ocr-content {
      font-size: 13px;
      color: #2D3748;
      line-height: 1.55;
      white-space: pre-line;
    }

    /* Photo Gallery */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .photo-thumb {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .photo-thumb:hover {
      transform: scale(1.02);
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    /* Bottom notice footer */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="header">
      <div class="brand-title">
        <span class="logo-icon">💛</span>
        <span>키즈노트 리포트</span>
      </div>
      <div class="timestamp">업데이트: 2026. 10. 26. AM 4:22:13</div>
    </header>

    <!-- Child Selector Tabs -->
    <div class="child-tabs">
      <button class="child-tab-btn " onclick="selectChild('ayoon')">
        <div class="child-avatar">👧</div>
        <div>
          <div class="child-info-name">정아윤</div>
          <div class="child-info-school">원흥유치원 가온 1반</div>
        </div>
      </button>
      <button class="child-tab-btn active" onclick="selectChild('yoona')">
        <div class="child-avatar">👶</div>
        <div>
          <div class="child-info-name">정윤아</div>
          <div class="child-info-school">고양시립푸른솔어린이집</div>
        </div>
      </button>
    </div>

    <!-- Category Filter Bar -->
    <div class="category-bar">
      <button class="cat-btn active" onclick="filterCategory('all', this)">전체</button>
      <button class="cat-btn" onclick="filterCategory('report', this)">알림장</button>
      <button class="cat-btn" onclick="filterCategory('notice', this)">공지사항·가정통신문</button>
      <button class="cat-btn" onclick="filterCategory('meal', this)">식단표</button>
    </div>

    <!-- Record Feed Container -->
    <main class="record-feed" id="recordFeed">
      <!-- Injected by JavaScript -->
    </main>

    <footer class="footer">
      토비 챗봇 키즈노트 연동 시스템 · 상기형님 전용 브리핑
    </footer>
  </div>

  <script>
    const allResults = [{"child":"yoona","childName":"정윤아","schoolName":"고양시립푸른솔어린이집 자람반","records":[{"id":"yoona-1792956133686-0","category":"notice","title":"원 공지","date":"2026.10.23.","author":"푸른솔어린이집 교사","content":"10월 3주 부모교육","imageUrls":["https://up-kids-kage.kakao.com/dn/bERgRT/dJMcagglq33/M6HNW5JI25iTgBRXJ3jck0/img_240x240.jpg","https://up-kids-kage.kakao.com/dn/AYkHW/dJMcaatL2fn/0wJuJUf4Cw7GKhiXfXP9c0/img_240x240.jpg","https://up-kids-kage.kakao.com/dn/kf8Cf/dJMcahTF0nH/GbopkhiITlkW3Sdcve4GLK/img_240x240.jpg","https://up-kids-kage.kakao.com/dn/bC9WQ2/dJMcacLVwkT/dNY5t2XKIYZ1lIiTGWfxPk/img_240x240.jpg","https://up-kids-kage.kakao.com/dn/eyJTN/dJMcadcGxiY/99XYYJhf9pNs0Tlr0xbbY0/pre1_small.jpg"]},{"id":"yoona-1792956133686-1","category":"notice","title":"10월 3주 부모교육","date":"2026.10.23.","author":"푸른솔어린이집 교사","content":"가을 나들이 추천!!! - 우리 아이와 가을을 걷다","imageUrls":[]},{"id":"yoona-1792956133686-2","category":"notice","title":"원 공지","date":"2026.10.22.","author":"푸른솔어린이집 교사","content":"[비상대응상황대처] 대테러 비상대응","imageUrls":[]},{"id":"yoona-1792956133686-3","category":"notice","title":"[비상대응상황대처] 대테러 비상대응","date":"2026.10.22.","author":"푸른솔어린이집 교사","content":"다양한 위기 상황에 대비하여 평소 안전수칙과 비상대응 행동요령을 미리 알아두는 것이 중요합니다. 테러는 예기치 않게 발생할 수 있는 만큼, 가정에서도 아이와 함께 테러 의심 상황 발생 시 행동요령을 확인해 보시기 바랍니다. 테러 의심 상황 발생 시 이렇게 행동하세요! ▪️ 수상한 물건이나 의심스러운 상황을 발견하면 가까이 가지 않기 ▪️ 위험한 상황에서는 신속하게 안전한 장소로 대피하기 ▪️ 경찰 등 관계 기관의 안내에 따라 침착하게 행동하기 ▪️ 테러 의심 상황을 발견하면 112에 신고하기 ▪️ 어린이집의 비상대응 안내와 안전 조치에 협조하기 가정에서도 함께 첨부된 대테러 비상대응 행동요령 카드뉴스를 살펴보시며 안전에 대비해 주시기 바랍니다. 우리 아이들의 안전을 위해 학부모님의 관심과 협조 부탁드립니다💙","imageUrls":[]},{"id":"yoona-1792956133686-4","category":"notice","title":"원 공지","date":"2026.10.22.","author":"푸른솔어린이집 교사","content":"▶푸른솔 책방 \"독서 시간\" 이번 주 책 소개","imageUrls":[]}]}];
    let currentChild = "yoona";
    let currentCat = "all";

    function selectChild(childKey) {
      currentChild = childKey;
      document.querySelectorAll('.child-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(childKey));
      });
      renderFeed();
    }

    function filterCategory(catKey, btnEl) {
      currentCat = catKey;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      btnEl.classList.add('active');
      renderFeed();
    }

    function renderFeed() {
      const feedEl = document.getElementById('recordFeed');
      const childData = allResults.find(r => r.child === currentChild);

      if (!childData || !childData.records || childData.records.length === 0) {
        feedEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <p>등록된 알림장이나 공지사항이 없습니다.</p>
          </div>`;
        return;
      }

      let filtered = childData.records;
      if (currentCat !== 'all') {
        filtered = filtered.filter(r => r.category === currentCat);
      }

      if (filtered.length === 0) {
        feedEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <p>해당 카테고리에 등록된 항목이 없습니다.</p>
          </div>`;
        return;
      }

      let html = '';
      for (const rec of filtered) {
        const badgeLabel = rec.category === 'notice' ? '공지사항' : (rec.category === 'meal' ? '식단표' : '알림장');
        
        let commentsHtml = '';
        if (rec.comments && rec.comments.length > 0) {
          commentsHtml = `
            <div class="comments-box">
              <div class="comments-header">💬 댓글 / 답글 (${rec.comments.length})</div>
              ${rec.comments.map(c => `
                <div class="comment-item">
                  <div class="comment-meta">
                    <span>${c.author || '선생님'}</span>
                    <span>${c.date || ''}</span>
                  </div>
                  <div class="comment-text">${c.content}</div>
                </div>
              `).join('')}
            </div>`;
        }

        let ocrHtml = '';
        if (rec.ocrSummary) {
          ocrHtml = `
            <div class="ocr-box">
              <div class="ocr-header">🖼️ 가정통신문 및 이미지 핵심 분석</div>
              <div class="ocr-content">${rec.ocrSummary}</div>
            </div>`;
        }

        let photosHtml = '';
        if (rec.imageUrls && rec.imageUrls.length > 0) {
          photosHtml = `
            <div class="photo-grid">
              ${rec.imageUrls.map(url => `<img class="photo-thumb" src="${url}" alt="사진" loading="lazy" onclick="window.open('${url}', '_blank')">`).join('')}
            </div>`;
        }

        html += `
          <article class="card">
            <div class="card-meta">
              <span class="card-badge">${badgeLabel}</span>
              <span class="card-date">${rec.date || ''}</span>
            </div>
            <h3 class="card-title">${rec.title || badgeLabel}</h3>
            <div class="card-author">${rec.author ? '작성: ' + rec.author : ''}</div>
            <div class="card-body">${rec.content || ''}</div>
            ${commentsHtml}
            ${ocrHtml}
            ${photosHtml}
          </article>
        `;
      }

      feedEl.innerHTML = html;
    }

    // Initial render
    renderFeed();
  </script>
</body>
</html>
