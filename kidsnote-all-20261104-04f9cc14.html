  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #F5F1EB;
      color: #2D3436;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* -------------------------------------------------------------- */
    /* CLAYMORPHISM 3D SHADOW SYSTEM (Hype4 & Three.js Volumetric)    */
    /* -------------------------------------------------------------- */

    /* 1. Main Fluffy 3D White Clay Card */
    .clay-card {
      background: #FFFFFF;
      border-radius: 30px;
      box-shadow: 
        inset 3px 3px 6px rgba(255, 255, 255, 0.95),
        inset -3px -3px 8px rgba(0, 0, 0, 0.04),
        0 14px 28px -4px rgba(45, 52, 54, 0.07),
        0 4px 10px -2px rgba(45, 52, 54, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.9);
    }

    /* 2. Puffy Clay Buttons with Tactile Squish */
    .clay-btn {
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.95),
        inset -2px -2px 6px rgba(0, 0, 0, 0.05),
        0 6px 14px -2px rgba(45, 52, 54, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-btn:active {
      transform: scale(0.94) translateY(2px);
      box-shadow: 
        inset 2px 2px 4px rgba(0, 0, 0, 0.08),
        inset -2px -2px 4px rgba(255, 255, 255, 0.7),
        0 2px 6px rgba(45, 52, 54, 0.04);
    }

    /* 3. Puffy Orange 3D Clay Active Button */
    .clay-btn-orange {
      background: linear-gradient(135deg, #FFA938 0%, #FF8A00 100%);
      color: #FFFFFF;
      border-radius: 18px;
      box-shadow: 
        inset 2px 2px 5px rgba(255, 255, 255, 0.5),
        inset -2px -2px 6px rgba(180, 60, 0, 0.35),
        0 8px 18px -2px rgba(255, 138, 0, 0.38);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-btn-orange:active {
      transform: scale(0.94) translateY(2px);
      box-shadow: 
        inset 2px 2px 4px rgba(180, 60, 0, 0.4),
        inset -2px -2px 4px rgba(255, 255, 255, 0.3),
        0 3px 8px rgba(255, 138, 0, 0.25);
    }

    /* 4. Pastel 3D Clay Category Tiles */
    .clay-tile-peach {
      background: linear-gradient(145deg, #FFF9F2 0%, #FFEEDD 100%);
      border-radius: 26px;
      box-shadow: 
        inset 3px 3px 5px rgba(255, 255, 255, 0.95),
        inset -3px -3px 6px rgba(255, 138, 0, 0.14),
        0 10px 20px -4px rgba(255, 138, 0, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.9);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-tile-peach:active {
      transform: scale(0.95) translateY(2px);
    }

    .clay-tile-blue {
      background: linear-gradient(145deg, #F3F9FF 0%, #E2F0FD 100%);
      border-radius: 26px;
      box-shadow: 
        inset 3px 3px 5px rgba(255, 255, 255, 0.95),
        inset -3px -3px 6px rgba(9, 132, 227, 0.14),
        0 10px 20px -4px rgba(9, 132, 227, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.9);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-tile-blue:active {
      transform: scale(0.95) translateY(2px);
    }

    .clay-tile-purple {
      background: linear-gradient(145deg, #F9F7FF 0%, #EFEAFF 100%);
      border-radius: 26px;
      box-shadow: 
        inset 3px 3px 5px rgba(255, 255, 255, 0.95),
        inset -3px -3px 6px rgba(108, 92, 231, 0.14),
        0 10px 20px -4px rgba(108, 92, 231, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.9);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-tile-purple:active {
      transform: scale(0.95) translateY(2px);
    }

    .clay-tile-mint {
      background: linear-gradient(145deg, #F2FCF9 0%, #DEF7EF 100%);
      border-radius: 26px;
      box-shadow: 
        inset 3px 3px 5px rgba(255, 255, 255, 0.95),
        inset -3px -3px 6px rgba(0, 184, 148, 0.14),
        0 10px 20px -4px rgba(0, 184, 148, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.9);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-tile-mint:active {
      transform: scale(0.95) translateY(2px);
    }

    /* 5. Inset Tactile Display Well */
    .clay-inset-well {
      background: #FAF8F5;
      border-radius: 22px;
      box-shadow: 
        inset 2px 2px 5px rgba(0, 0, 0, 0.05),
        inset -2px -2px 5px rgba(255, 255, 255, 0.9);
      border: 1px solid #EFECE6;
    }

    /* 6. Teacher & Parent 3D Speech Bubbles */
    .clay-teacher-bubble {
      background: linear-gradient(145deg, #FFFDF6 0%, #FFF8E7 100%);
      border-radius: 22px;
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.95),
        inset -2px -2px 6px rgba(255, 170, 0, 0.12),
        0 6px 16px -2px rgba(255, 170, 0, 0.08);
      border: 2px solid #FFEBB8;
    }
    .clay-parent-bubble {
      background: #FFFFFF;
      border-radius: 22px;
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.95),
        inset -2px -2px 6px rgba(0, 0, 0, 0.04),
        0 6px 14px -2px rgba(0, 0, 0, 0.04);
      border: 2px solid #F0EFEA;
    }

    /* 7. Floating 3D Clay Bottom Navigation Dock */
    .clay-bottom-dock {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.95),
        inset -2px -2px 6px rgba(0, 0, 0, 0.05),
        0 16px 36px -4px rgba(45, 52, 54, 0.14);
      border: 2px solid rgba(255, 255, 255, 0.85);
    }

    .pb-safe { padding-bottom: max(100px, calc(env(safe-area-inset-bottom) + 88px)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .break-keep { word-break: keep-all; }

s":[]},{"id":"yoona-1793769631453-report-1","category":"report","title":"알림장 (선생님의 글)","date":"11월 2일 월요일","author":"푸른솔어린이집 교사","content":"안녕하세요~ 주말 잘 보내셨나요?\n어제 내린 비로 촉촉해진 가을 풍경과 함께 11월의 첫 월요일을 맞이했습니다. 🍂\n\n오늘은 친구들과 함께 인형극을 관람하며 즐거운 시간을 보냈습니다. 이번 인형극은 장애가 있는 친구와 함께 어울리며 서로의 다름을 이해하고 존중하는 내용이었어요. 우리 모두 모습과 표현하는 방법은 조금씩 다르지만, 함께 어울리며 즐겁게 지낼 수 있다는 따뜻한 이야기를 만나보았답니다. 💕\n\n인형극 관람 후에는 가을 풍경을 느껴 보기 위해 산책을 다녀왔습니다. 산책길에 과일 가게를 지나가 보며 감, 배, 사과 등 다양한 가을 열매를 살펴볼 수 있었어요~ 또 어제 내린 비로 떨어진 나뭇잎들이 바닥을 가득 채워 노랗고 빨갛게 물든 나뭇잎을 하나씩 주워보며 가을다운 풍경 속에서 즐거운 산책을 하고 돌아왔습니다. 🍁\n\n* 윤아 낮잠자며 기침을 종종 보였습니다. 살펴봐 주세요.\n\n기온이 떨어지며 감기에 걸리기 쉬운 날씨입니다~ 감기 조심하세요!","imageUrls":[]},{"id":"yoona-1793769631453-report-2","category":"report","title":"알림장 (선생님의 글)","date":"10월 30일 금요일","author":"푸른솔어린이집 교사","content":"안녕하세요~\n오늘은 아이들이 기다리던 가을 캠핑이 있는 날입니다! 🍂\n\n알록달록 예쁘게 물든 가을 풍경 속에서 가족과 함께 특별한 추억을 만들어 보는 시간을 가져보려고 해요. 💕\n\n가족과 함께 다양한 놀이에 참여하며 몸도 마음도 활짝 움직이고, 서로 웃고 교감하며 즐거운 시간을 보내길 기대합니다. 🥰\n\n* 다음 주 월요일에는 덕양구노인복지관에서 주최하는 도담도담 인형극 관람이 있을 예정입니다. 원에서 관람예정이며 10시 전 등원 부탁드립니다.\n\n* 월요일에는 자람반 이선영 선생님의 연차사용으로 최영희 보조선생님께서 함께 해주실 예정입니다. 연차기간 중 활동 알림장은 작성되지 않으며 생활기록 알림장만 발송됨을 알려드립니다.","imageUrls":[]},{"id":"yoona-1793769631453-notice-0","category":"notice","title":"원 공지 | 🌈2026년 3분기 운영위원회 회의 결과 안내","date":"2026년 11월 3일","author":"푸른솔어린이집 교사","content":"바쁘신 중에도 함께 해주신 운영위원님들께 감사함을 전하며\n지난 10월 13일 개최된 운영위원회 회의 결과를 아래와 같이 공지드립니다.\n\n푸른 솔 보호자분들의 아낌없는 관심과 사랑, 적극적인 참여를 부탁드립니다. 😊","imageUrls":["https://up-kids-kage.kakao.com/dn/YQ36c/dJMcacrN1SP/ICkPK69qBY73FVS4i1TkYk/img_l.jpg"]},{"id":"yoona-1793769631453-notice-1","category":"notice","title":"원 공지 | 👂[이벤트 정답] 우리 아이의 귀는 몇 번이었을까요?","date":"2026년 11월 3일","author":"푸른솔어린이집 교사","content":"안녕하세요😊\n가을 가족 캠프에서 뜨거운 눈치싸움(?)과 몰입도를 자랑했던 '우리 아이 신체 찾기' 이벤트의 정답을 공개합니다!\n\"매일 보는 귀인데 왜 이렇게 헷갈릴까요?\", \"우리 아이 귀가 확실합니다!\" 하며 열정적으로 정답을 적어주시는 보호자분들의 모습에 저희 교사들도 정말 즐거웠답니다. 역시 눈썰미 최고인 푸른솔 가족분들답게 많은 분이 정답을 맞혀주셨습니다! 정답은 아래 사진을 통해 확인해 보세요!\n\n우리 아이의 예쁜 귀를 단번에 알아맞히신 ‘정답 가족’에게는 기분 좋은 '깜짝 선물'을 보낼 예정입니다. 선물드리는       const [selectedDateIdx, setSelectedDateIdx] = useState(0);

      const [likes, setLikes] = useState({});

      const activeChildData = useMemo(() => {
        return rawData.find(d => d.child === currentChild) || rawData[0];
      }, [currentChild]);

      const reports = useMemo(() => {
        return (activeChildData?.records || []).filter(r => r.category === 'report');
      }, [activeChildData]);

      const notices = useMemo(() => {
        return (activeChildData?.records || []).filter(r => r.category === 'notice');
      }, [activeChildData]);

        if (!activeChildData) return [];
        const set = new Set();
        for (const r of activeChildData.records) {
          for (const u of (r.imageUrls || [])) {
            if (u && !u.includes('undefined')) set.add(u);
          }
          for (const c of (r.comments || [])) {
            for (const cu of (c.imageUrls || [])) {
              if (cu && !cu.includes('undefined')) set.add(cu);
            }
          }
        }
        return Array.from(set);
      }, [activeChildData]);

      const activeReport = reports[selectedDateIdx] || reports[0];

      const toggleLike = (id) => {
        setLikes(prev => ({
          ...prev,
          [id]: {
            liked: !prev[id]?.liked,
            count: (prev[id]?.count || 1) + (prev[id]?.liked ? -1 : 1)
          }

                    </div>

                    {activeReport.imageUrls && activeReport.imageUrls.length > 0 && (
                      <div className="space-y-2 pt-1">
                        <div className="flex items-center justify-between text-xs font-extrabold text-clay-gray">
                          <span className="flex items-center gap-1.5">
                            <Icons.PhotoIcon size={14} />
                            활동 사진 ({activeReport.imageUrls.length}장)
                          </span>
                          <span className="text-[11px] text-clay-muted">클릭 시 확대보기</span>
                        </div>
                        <div className="grid grid-cols-2 gap-2.5">
                          {activeReport.imageUrls.map((url, imgIdx) => (
                            <div
                              key={imgIdx}
                              onClick={() => setModalImage(url)}
                              className="aspect-[4/3] rounded-2xl overflow-hidden bg-clay-inset-well cursor-pointer relative group border border-black/5 shadow-sm active:scale-95 transition-transform"
                            >
                              <img
                                src={url}
                                alt="알림장 사진"
                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                loading="lazy"
                                onError={(e) => {
                                  if (e.currentTarget.parentElement) {
                                    e.currentTarget.parentElement.style.display = 'none';
                                  }
                                }}
                              />
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    <div className="pt-2 flex items-center justify-between border-t border-black/5">
                      <button
                        onClick={() => toggleLike(activeReport.id || selectedDateIdx)}
                        className="clay-btn px-4 py-2 flex items-center gap-2 text-xs font-black text-clay-dark active:scale-95 transition-transform"
                      >
                        <Icons.LikeStamp />
                        <span>공감해요</span>
                        <span className="text-amber-600 font-extrabold ml-0.5">
                          {likes[activeReport.id || selectedDateIdx]?.count || 1}
                        </span>
                      </button>

                      <div className="text-xs text-clay-muted font-bold flex items-center gap-1">
                        <Icons.CommentBubble size={14} className="text-clay-muted" />
                        <span>댓글 {activeReport.comments?.length || 0}개</span>
                      </div>
                    </div>

                    {activeReport.comments && activeReport.comments.length > 0 && (
                      <div className="space-y-3 pt-2">
                        <div className="flex items-center gap-1.5 text-xs font-black text-clay-dark">
                          <Icons.CommentBubble size={15} className="text-amber-600" />
                          <span>선생님 & 학부모 소통 댓글</span>
                          <span className="text-amber-600">({activeReport.comments.length})</span>
                        </div>

                        <div className="space-y-2.5">
                          {activeReport.comments.map((cmt, cIdx) => {
                            const isTeacher = cmt.author.includes('교사') || cmt.author.includes('선생');
                            return (
                              <div
                                key={cIdx}
                                className={`p-3.5 space-y-2 ${
                                  isTeacher ? 'clay-teacher-bubble' : 'clay-parent-bubble'
                                }`}
                              >
                                <div className="flex items-center justify-between">
                                  <div className="flex items-center gap-2">
                                    <span
                                      className={`text-[11px] font-black px-2.5 py-0.5 rounded-full ${
                                        isTeacher
                                          ? 'bg-amber-200 text-amber-900'
                                          : 'bg-blue-100 text-blue-900'
                                      }`}
                                    >
                                      {cmt.author}
                                    </span>
                                  </div>
                                  <span className="text-[11px] text-clay-muted font-bold">
                                    {cmt.date}
                                  </span>
                                </div>

                                <p className="text-[13px] text-clay-dark leading-relaxed font-medium break-keep whitespace-pre-line pl-1">
                                  {cmt.content}
                                </p>

                                {cmt.imageUrls && cmt.imageUrls.length > 0 && (
                                  <div className="pt-1.5 space-y-1">
                                    <div className="text-[11px] font-extrabold text-blue-700 flex items-center gap-1">
                                      <Icons.PhotoIcon size={12} />
                                      첨부 사진 ({cmt.imageUrls.length}장)
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                      {cmt.imageUrls.map((cImg, cImgIdx) => (
                                        <div
                                          key={cImgIdx}
                                          onClick={() => setModalImage(cImg)}
                                          className="aspect-square rounded-xl overflow-hidden bg-clay-inset-well border border-black/5 cursor-pointer shadow-sm active:scale-95 transition-transform"
                                        >
                                          <img
                                            src={cImg}
                                            alt="댓글 사진"
                                            className="w-full h-full object-cover"
                                            loading="lazy"
                                          />
                                        </div>
                                      ))}
                                    </div>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}

                  </article>
                ) : (
                  <div className="clay-card p-10 text-center space-y-2">
                    <Icons.Report size={40} className="mx-auto text-clay-muted" />
                    <p className="text-sm font-black text-clay-dark">조회된 알림장이 없습니다.</p>
                  </div>
                )}
              </>
            )}

            {currentTab === 'notice' && (
              <div className="space-y-3.5">
                {notices.map((ntc, nIdx) => (
                  <article key={nIdx} className="clay-card p-5 space-y-3.5">
                    <div className="flex items-center justify-between border-b border-black/5 pb-3">
                      <div className="flex items-center gap-2">
                        <Icons.Notice size={22} />
                        <span className="text-xs font-black text-blue-700">원 공지안내</span>
                      </div>
                      <span className="text-xs text-clay-muted font-bold">{ntc.date}</span>
                    </div>

                    <h2 className="text-base font-black text-clay-dark leading-snug">
                      {ntc.title || '가정통신문 안내'}
                    </h2>

                    <div className="clay-inset-well p-4">
                      <p className="text-[14px] text-clay-dark leading-relaxed font-medium break-keep whitespace-pre-line">
                        {ntc.content}
                      </p>
                    </div>

                    {ntc.ocrSummary && (
                      <div className="bg-blue-50/70 border border-blue-200/60 rounded-2xl p-4 space-y-2">
                        <div className="flex items-center gap-1.5 text-xs font-black text-blue-900">
                          <Icons.DocScan size={15} />
                          <span>가정통신문 원문 문서 요약 (OCR)</span>
                        </div>
                        <p className="text-xs text-blue-950 leading-relaxed break-keep whitespace-pre-line">
                          {ntc.ocrSummary}
                        </p>
                      </div>
                    )}

                    {ntc.imageUrls && ntc.imageUrls.filter(u => u && !u.includes('undefined')).length > 0 && (
                      <div className="grid grid-cols-2 gap-2 pt-1">
                        {ntc.imageUrls.filter(u => u && !u.includes('undefined')).map((url, imgIdx) => (
                          <div
                            key={imgIdx}
                            onClick={() => setModalImage(url)}
                            className="aspect-[4/3] rounded-2xl overflow-hidden bg-clay-inset-well cursor-pointer border border-black/5 shadow-sm active:scale-95 transition-transform"
                          >
                            <img
                              src={url}
                              alt="통신문 사진"
                              className="w-full h-full object-cover"
                              loading="lazy"
                              onError={(e) => {
                                if (e.currentTarget.parentElement) {
                                  e.currentTarget.parentElement.style.display = 'none';
                                }
                              }}
                            />
                          </div>
                        ))}
                      </div>
                    )}
                  </article>
                ))}
              </div>
            )}

            {currentTab === 'album' && (
              <div className="clay-card p-5 space-y-4">
                <div className="flex items-center justify-between border-b border-black/5 pb-3">
                  <div className="flex items-center gap-2">
                    <Icons.Album size={24} />
                    <span className="text-sm font-black text-clay-dark">원생활 고화질 사진첩</span>
                  </div>
                  <span className="text-xs text-purple-700 font-extrabold bg-purple-50 px-3 py-1 rounded-full">
                    {allGalleryPhotos.length}장
                  </span>
                </div>

                {allGalleryPhotos.length === 0 ? (
                  <div className="text-center py-12 text-clay-gray text-xs font-bold bg-white/50 rounded-2xl p-6">
                    <div className="w-12 h-12 mx-auto mb-2 opacity-50 flex items-center justify-center">
                      <Icons.Album size={32} />
                    </div>
                    등록된 활동 사진이 없습니다.
                  </div>
                ) : (
                  <div className="grid grid-cols-2 gap-2.5">
                    {allGalleryPhotos.map((url, i) => (
                      <div
                        key={i}
                        onClick={() => setModalImage(url)}
                        className="aspect-square rounded-2xl overflow-hidden bg-clay-inset-well cursor-pointer group relative border border-black/5 shadow-sm active:scale-95 transition-transform"
                      >
                        <img
                          src={url}
                          alt="갤러리 사진"
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                          loading="lazy"
                          onError={(e) => {
                            if (e.currentTarget.parentElement) {
                              e.currentTarget.parentElement.style.display = 'none';
                            }
                          }}
                        />
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {currentTab === 'meal' && (
              <div className="clay-card p-5 space-y-4">
                <div className="flex items-center justify-between border-b border-black/5 pb-3">
                  <div className="flex items-center gap-2">
                    <Icons.Meal size={24} />
                    <span className="text-sm font-black text-clay-dark">오늘의 영양식단</span>
                  </div>
                  <span className="text-xs text-emerald-700 font-extrabold bg-emerald-50 px-3 py-1 rounded-full">
                    영양사 검수 완료
                  </span>
                </div>

                <div className="clay-inset-well p-5 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-black text-emerald-900 bg-emerald-100/90 px-2.5 py-1 rounded-xl">
                      점심 식단 (중식)
                    </span>
                    <span className="text-xs text-clay-muted font-bold">원흥유치원 / 푸른솔어린이집</span>
                  </div>
                  <p className="text-sm font-bold text-clay-dark leading-relaxed">
                    친환경 기장밥, 쇠고기미역국, 닭다리살데리야끼구이, 청경채나물, 깍두기 (백김치)
                  </p>
                  <div className="pt-2 border-t border-black/5 flex items-center justify-between text-xs text-clay-gray font-bold">
                    <span>오후 간식</span>
                    <span className="text-clay-dark">우리쌀 찐빵 & 유기농 바나나 우유</span>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* 5. FLOATING BOTTOM DOCK */}
          <div className="fixed bottom-4 left-0 right-0 max-w-[400px] mx-auto px-4 z-30 pointer-events-none">
            <nav className="clay-bottom-dock px-3 py-2 flex items-center justify-around pointer-events-auto">
              <button
                onClick={() => setCurrentTab('report')}
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-2xl transition-all ${
                  currentTab === 'report' ? 'text-amber-600 font-black' : 'text-clay-gray font-bold'
                }`}
              >
                <Icons.Report size={22} />
                <span className="text-[11px]">알림장</span>
              </button>

              <button
                onClick={() => setCurrentTab('notice')}
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-2xl transition-all ${
                  currentTab === 'notice' ? 'text-blue-600 font-black' : 'text-clay-gray font-bold'
                }`}
              >
                <Icons.Notice size={22} />
                <span className="text-[11px]">가정통신문</span>
              </button>

              <button
                onClick={() => setCurrentTab('album')}
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-2xl transition-all ${
                  currentTab === 'album' ? 'text-purple-600 font-black' : 'text-clay-gray font-bold'
                }`}
              >
                <Icons.Album size={22} />
                <span className="text-[11px]">사진첩</span>
              </button>

              <button
                onClick={() => setCurrentTab('meal')}
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-2xl transition-all ${
                  currentTab === 'meal' ? 'text-emerald-600 font-black' : 'text-clay-gray font-bold'
                }`}
              >
                <Icons.Meal size={22} />
                <span className="text-[11px]">식단표</span>
              </button>
            </nav>
          </div>

          {/* 6. PHOTO MODAL */}
          {modalImage && (
            <div
              onClick={() => setModalImage(null)}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4 cursor-zoom-out"
            >
              <div className="relative max-w-full max-h-full">
                <img
                  src={modalImage}
                  alt="사진 확대보기"
                  className="max-h-[88vh] max-w-[94vw] object-contain rounded-3xl shadow-2xl border-2 border-white/20"
                />
                <button
                  onClick={() => setModalImage(null)}
                  className="absolute top-4 right-4 bg-white/30 hover:bg-white/50 text-white font-black px-4 py-1.5 rounded-full backdrop-blur-md transition-colors text-xs shadow-lg flex items-center gap-1"
                >
                  <Icons.Close size={14} className="text-white" />
                  <span>닫기</span>
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
